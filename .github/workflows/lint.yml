name: Lint
on:
  push:
    paths:
      - '**.lua'
      - '.github/workflows/lint.yml'
  pull_request_target:
    paths:
      - '**.lua'
      - '.github/workflows/lint.yml'
jobs:
  lint:
    name: Lint Resource
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Lint
        uses: iLLeniumStudios/fivem-lua-lint-action@v2
        with:
          capture: "junit.xml"
          args: "-t --formatter JUnit"
          # Without this the action exits 0 on warnings (only luacheck's exit
          # >=2, i.e. syntax errors, fails), so undefined globals and unused
          # locals -- the warnings that turn into runtime nils -- passed
          # silently. The junit report step cannot fail either: fail_on_failure
          # is false. Suppress a known false positive inline, not by flipping
          # this back.
          fail_on_warnings: "true"
          extra_libs: ox_lib+mysql+qblocales+qbox+qbox_playerdata+qbox_lib
      - name: Generate Lint Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "**/junit.xml"
          check_name: Linting Report
          fail_on_failure: false
