name: Sync upstream

# Keeps this fork's main fast-moving with Qbox-project/qbx_core without
# manual "sync fork" clicks. Uses fetch+merge rather than the GitHub
# "sync fork" button (or `gh repo sync`), because that only fast-forwards --
# it refuses the moment this fork carries its own commits (gphone_* tables,
# npwd config removal, etc.), which is the whole point of forking.
#
# On a real conflict this aborts and fails loudly rather than guessing --
# check the failed run and resolve by hand:
#   git remote add upstream https://github.com/Qbox-project/qbx_core.git
#   git fetch upstream main && git merge upstream/main
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {}

# The push goes out with SYNC_TOKEN, not GITHUB_TOKEN. GITHUB_TOKEN can never
# hold the `workflows` permission, so GitHub rejects any push from it that
# touches .github/workflows/ -- and upstream edits its workflows regularly. A
# push made with GITHUB_TOKEN also triggers no further workflows, so the merged
# result would land on main without Lint or Checks ever seeing it.
#
# SYNC_TOKEN: a fine-grained personal access token scoped to this repository
# only, with "Contents: read and write" and "Workflows: read and write".
#
# GITHUB_TOKEN itself needs nothing beyond reading.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # No fallback to GITHUB_TOKEN when the secret is missing or expired: that
      # would pass every day upstream leaves the workflows alone and fail only
      # on the day it does not, which reads as working until it matters.
      - name: Require SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is not set -- see the comment at the top of this workflow"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Qbox-project/qbx_core.git
          git fetch upstream main

      - name: Merge upstream into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge upstream/main --no-edit; then
            git push origin main
          else
            echo "::error::Merge conflict syncing upstream/main -- resolve manually, see workflow comment for the commands"
            git merge --abort
            exit 1
          fi
